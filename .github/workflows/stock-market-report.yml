name: Stock Market Report

on:
  schedule:
    - cron: "0 9 1 */3 *"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: pip install yfinance pandas matplotlib numpy

      - name: Run Script
        run: python report.py
        env:
          GOOGLEPASSKEY: ${{ secrets.GOOGLEPASSKEY }}
