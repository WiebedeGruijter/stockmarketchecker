# ---------------------------------------------------------------------------
# huurwatcher config
#
# Voor elke site die je wilt volgen komt er een blok onder "sites:".
# De selectors (listing_selector, title_selector, etc.) zijn CSS-selectors.
# Hoe je die vindt staat in README.md ("Selectors vinden met devtools").
#
# filters zijn optioneel: laat een veld weg (of zet op null) om niet te filteren.
# ---------------------------------------------------------------------------

check_interval_minutes: 5

notify:
  # "email" -> stuurt een e-mail via Gmail SMTP
  # "mac"   -> native macOS notificatie (osascript)
  # "telegram" -> stuurt via een Telegram bot
  channels: ["email"]
  email:
    host: "smtp.gmail.com"
    port: 587
    username: "wiebedg@gmail.com"
    password: ""  # gebruik GitHub Secret GOOGLEPASSKEY in GitHub Actions
    from_address: "wiebedg@gmail.com"
    to_address: "wiebedg@gmail.com"
  telegram:
    bot_token: ""     # van @BotFather
    chat_id: ""        # jouw chat id, zie README

sites:
  - name: vesteda
    enabled: true
    # URL van de gefilterde zoekresultatenpagina. Deze URL is door de browser
    # verkregen van de echte zoekresultatenpagina en is ook bruikbaar als fallback.
    listing_url: "https://www.vesteda.com/nl/woning-zoeken?placeType=1&sortType=0&radius=20&s=Amsterdam,+Nederland&sc=woning&latitude=52.367573&longitude=4.904139&filters=6855&priceFrom=500&priceTo=1700"
    # Vesteda levert de resultaten in een JSON API terug; dat is stabieler dan CSS
    # selectors. De gegevens hieronder zijn getest tegen de live site.
    api_url: "https://www.vesteda.com/api/units/search/facet"
    api_method: "POST"
    api_payload:
      s: "Amsterdam"
      placeType: 1
      rootId: 1303
    # Fallback CSS-selectors als de API later niet beschikbaar is.
    listing_selector: "article, li"
    title_selector: "h3, h4"
    price_selector: ".price, [class*='price']"
    link_selector: "a[href]"
    link_attr: "href"
    base_url: "https://www.vesteda.com"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: vbt
    enabled: true
    # The generic /woningen page is an all-cities overview; the Amsterdam list is
    # only returned when the city query parameter is present.
    listing_url: "https://vbtverhuurmakelaars.nl/woningen?city=amsterdam"
    listing_selector: "a.property"
    title_selector: ".normal"
    price_selector: ".price"
    city_selector: ".items > div:first-child"
    link_selector: "a.property"
    link_attr: "href"
    base_url: "https://vbtverhuurmakelaars.nl"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: mvgm
    enabled: false
    # The Amsterdam page currently behaves like a generic landing page, not a
    # real filtered property list, so it is disabled until a reliable listings URL
    # or API endpoint is confirmed.
    listing_url: "https://mvgm.com/nl/woningen-amsterdam/"
    listing_selector: "article, li, .item, .property, .card"
    title_selector: "h2, h3, h4, .entry-title"
    price_selector: ".price, [class*='price']"
    link_selector: "a[href]"
    link_attr: "href"
    base_url: "https://mvgm.com"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: ikwilhuren
    enabled: true
    listing_url: "https://ikwilhuren.nu/aanbod/"
    listing_selector: ".card-woning"
    title_selector: ".card-title a"
    price_selector: ".fw-bold"
    city_selector: ".card-body > span:nth-of-type(2)"
    link_selector: ".card-title a"
    link_attr: "href"
    base_url: "https://ikwilhuren.nu"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: vanderlinden
    enabled: true
    listing_url: "https://www.vanderlinden.nl/woning-huren/"
    listing_selector: ".woninginfo"
    title_selector: "strong"
    price_selector: ".mt-2"
    city_selector: ".text-80.mb-0"
    link_selector: "a.blocklink"
    link_attr: "href"
    base_url: "https://www.vanderlinden.nl"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: schep
    enabled: true
    listing_url: "https://zoeken.schepvastgoedmanagers.nl/huur/woningen"
    api_type: "schep"
    api_url: "https://zoeken.schepvastgoedmanagers.nl/api/ms/listing/properties"
    api_params:
      perPage: 200
      page: 1
      sort: "-published_at"
      filter[stage]: "available"
      filter[import_type]: "RentResident"
    base_url: "https://zoeken.schepvastgoedmanagers.nl"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: rebo
    enabled: true
    listing_url: "https://www.rebogroep.nl/nl/particulier/ons-aanbod/huren"
    api_type: "algolia"
    api_url: "https://240m1w8agr-dsn.algolia.net/1/indexes/private_objects_rent_sale_nl_status_asc/query"
    application_id: "240M1W8AGR"
    api_key: "055822c5312edb8cf91a483936751fac"
    api_payload:
      query: ""
      facetFilters: ["type_facet:rent||rent"]
      facets: ["*"]
      hitsPerPage: 1000
      page: 0
      sortFacetValuesBy: "alpha"
      maxValuesPerFacet: 99999999
    base_url: "https://www.rebogroep.nl"
    url_prefix: "nl"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null

  - name: mijndak
    enabled: false
    # De openbare pagina toont momenteel geen aanbod zonder inloggen; de
    # OutSystems-aanbodcalls zijn sessiegebonden en daarom niet betrouwbaar
    # genoeg voor deze requests-based watcher.
    listing_url: "https://amsterdam.mijndak.nl/Woningaanbod"
    base_url: "https://amsterdam.mijndak.nl"
    filters:
      city: "Amsterdam"
      max_price: 1700
      min_rooms: null
