name: Huurwatcher

permissions:
  contents: write

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/5 * * * *'

concurrency:
  group: huurwatcher-main
  cancel-in-progress: false

jobs:
  check-listings:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ./huurwatcher
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        working-directory: ./huurwatcher
        env:
          GOOGLEPASSKEY: ${{ secrets.GOOGLEPASSKEY }}
          EMAIL_FROM: wiebedg@gmail.com
          EMAIL_TO: wiebedg@gmail.com
        run: python scraper.py

      - name: Save seen state back to the repo
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add huurwatcher/seen.json
          if git diff --cached --quiet; then
            echo "No state change to save."
            exit 0
          fi
          git commit -m "Update huurwatcher seen state"
          git push origin HEAD:main
