name: Monthly S&P 500 Report
on:
  schedule:
    - cron: "0 9 1 */3 *"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas matplotlib numpy
      - run: python report.py
        env:
          GOOGLEPASSKEY: ${{ secrets.GOOGLEPASSKEY }}
