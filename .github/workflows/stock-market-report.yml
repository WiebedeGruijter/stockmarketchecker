name: Stock Market Report

on:
  schedule:
    # April, July, October (CEST / Summer Time): 10:00 UTC = 12:00 PM Amsterdam
    - cron: "0 10 1 4,7,10 *"
    # January (CET / Winter Time): 11:00 UTC = 12:00 PM Amsterdam
    - cron: "0 11 1 1 *"
  workflow_dispatch: {}

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install yfinance pandas matplotlib numpy

      - name: Run Script
        run: python report.py
        env:
          GOOGLEPASSKEY: ${{ secrets.GOOGLEPASSKEY }}
