name: Huurwatcher

on:
  workflow_dispatch: {}
  schedule:
    - cron: '*/15 * * * *'

jobs:
  check-listings:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./huurwatcher
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          GOOGLEPASSKEY: ${{ secrets.GOOGLEPASSKEY }}
          EMAIL_FROM: wiebedg@gmail.com
          EMAIL_TO: wiebedg@gmail.com
        run: python scraper.py --site vesteda
